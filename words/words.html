<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words from videos</title>
<style>
  :root { --fg: #222; --muted: #666; --bg: #fff; --card: #f5f5f7; --line: #e2e2e8; --accent: #3b6ef5; --danger: #c4372b; --en: #8a5a00; --mark: #fff0b8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececf1; --muted: #9a9aa6; --bg: #17171b; --card: #232329; --line: #34343c; --accent: #8fb0ff; --danger: #ff8a7d; --en: #ffe7a3; --mark: #5a4a12; }
  }
  * { box-sizing: border-box; }
  body { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; font: 14px/1.5 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  .muted { color: var(--muted); }
  button, select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.confirm { border-color: var(--danger); color: var(--danger); }
  a { color: var(--accent); }

  .group { background: var(--card); border-radius: 10px; margin: 0 0 12px; }
  .group > summary { list-style: none; cursor: pointer; padding: 12px 16px; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); }
  .group[open] > summary::before { content: "▾"; }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color: var(--muted); font-size: 13px; margin-left: 1em; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 0 16px 8px; }
  .actions .spacer { flex: 1; }

  .words { list-style: none; margin: 0; padding: 0 16px 12px; }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .row input { margin-top: 4px; }
  .row .main { flex: 1; min-width: 0; }
  .row .word { font-weight: 600; }
  .row .lemma { color: var(--muted); }
  .row .en { color: var(--en); }
  .row .count, .row .clicked, .row .status { font-size: 12px; color: var(--muted); }
  .row .clicked { border: 1px solid var(--muted); border-radius: 4px; padding: 0 4px; }
  .row .ctx { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .row .ctx mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .row.known { opacity: 0.5; }
  .row.known .main { padding-left: 23px; }
  .row.saving .status::after { content: "Saving…"; }
  .known-head { font-size: 12px; color: var(--muted); padding: 10px 0 2px; border-top: 1px solid var(--line); }
  .empty { padding: 24px 16px; }
</style>
</head>
<body>
  <header>
    <h1>Words from videos</h1>
    <label class="muted">Order
      <select id="sort">
        <option value="order">Order of appearance</option>
        <option value="frequent">Most frequent</option>
      </select>
    </label>
  </header>
  <p class="muted">Words that got a translation on screen, by video. Words you already know are greyed out at the bottom.</p>
  <main id="groups"></main>

  <script src="../src/store.js"></script>
  <script src="../src/ai.js"></script>
  <script src="../src/words.js"></script>
  <script src="words.js"></script>
</body>
</html>
